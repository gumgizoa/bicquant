log_level: INFO

watchlist_report:
  # 관심종목 리포트 발송 시각 (KST, 월~금)
  # 장 시작: 이격도 + MDD
  # 장 마감: 이격도 + MDD + 신용잔고/공매도/대차 (일별 결제 기준 데이터라 장 마감에만)
  open_time: "09:00"
  close_time: "15:30"

deviation:
  # 이격도 = 현재가 / MA50 * 100. 이 값 이상이면 강조
  threshold: 130.0

mdd:
  # 최근 period 거래일 기준 최대낙폭. alert_threshold 이하면 강조
  period: 60
  alert_threshold: -20.0
