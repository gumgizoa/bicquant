log_level: INFO

daily_report:
  # 일일 리포트 발송 시각 (KST, 월~금). 시장 요약과 관심종목 리포트가 각각 별도 메시지로 나간다.
  # 장 시작: 시장 요약(지수 이격도 + ADR + 해외 거시 지표) / 관심종목(이격도 + MDD)
  # 장 마감: 시장 요약 + 신용공여 잔고 / 관심종목 + 신용잔고·공매도·대차 (일별 결제 기준 데이터라 장 마감에만)
  open_time: "09:00"
  close_time: "15:30"

deviation:
  # 이격도 = 현재가 / MA50 * 100. 이 값 이상이면 강조 (지수·관심종목 공통)
  threshold: 130.0

adr:
  # ADR = 100 * sum(상승 종목수) / sum(하락 종목수), 최근 period 거래일 기준
  period: 20
  # >= overbought: 과열권, <= oversold: 바닥권
  overbought: 120.0
  oversold: 75.0

mdd:
  # 최근 period 거래일 기준 최대낙폭. alert_threshold 이하면 강조
  period: 60
  alert_threshold: -20.0

macro:
  # 해외 거시 지표 (FRED). 시장 요약 메시지의 마지막 블록으로 붙는다.
  # treasury: 미 국채 10년물 (DGS10, 일별, %) — 전 거래일 대비 변동이 move_alert(%p) 이상이면 강조
  # m2_us: 미국 M2 통화량 (M2SL, 월별 계절조정, 십억 달러)
  # 한국 M2는 ECOS 키가 생기면 추가한다 (FRED의 한국 계열은 2017년에 끊겼다).
  treasury_series: DGS10
  treasury_move_alert: 0.10
  m2_us_series: M2SL
