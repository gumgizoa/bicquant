[project]
name = "bicquant-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "requests",
    "python-dotenv",
    "python-telegram-bot>=20.0",
    "psycopg2-binary",
    "langchain",
    "langchain-anthropic",
    "langchain-openai",
    "pandas",
    "numpy",
    "matplotlib",
    "fredapi",
    "hmmlearn",
    "yfinance",
    "statsmodels",
    "seaborn",
    "openpyxl",
    "paramiko",
    "lsapi",
]

[dependency-groups]
dev = [
    "ruff==0.11.2",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
]

[tool.uv.sources]
lsapi = { workspace = true }
