[project]
name = "kofiaapi"
version = "0.1.0"
requires-python = ">=3.12"
description = "KOFIA FreeSIS (금융투자협회 종합통계) Python client"
dependencies = [
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
