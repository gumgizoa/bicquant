default_language_version:
  python: python3

ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=3000']
      - id: end-of-file-fixer
        exclude: ^archive/
      - id: trailing-whitespace
        exclude: ^archive/

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # Ruff version.
    rev: 'v0.11.2'
    hooks:
      - id: ruff
        args: ['--fix']
        exclude: ^archive/
      - id: ruff-format
        exclude: ^archive/

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Full suite, live tests included: the developer machine has .env, so the
        # LS gateway / DART / KOFIA / telegram calls all resolve here. CI cannot —
        # the runner has no credentials — so ci.yml gates on -m "not slow" instead.
        # This is the only place the live tests run automatically.
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
