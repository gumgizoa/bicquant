[pytest]
# Pytest configuration file
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    asyncio: marks tests as async (using pytest-asyncio)
    slow: marks tests as slow (deselect with '-m "not slow"')

filterwarnings =
    # Triggered by anyio/asyncio internals under Python 3.11+ during cancellation/teardown.
    # Keep the filter narrow so we don't hide other DeprecationWarnings.
    ignore:Passing 'msg' argument to Task\.cancel\(\) is deprecated since Python 3\.11.*:DeprecationWarning
    ignore:Passing 'msg' argument to Future\.cancel\(\) is deprecated since Python 3\.11.*:DeprecationWarning
    # Pydantic v2 deprecations in publicfc/database/schemas.py (Field(example=...), class Config).
    ignore::pydantic.warnings.PydanticDeprecatedSince20
