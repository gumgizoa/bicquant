services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run python -m bot.main
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
