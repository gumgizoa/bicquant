services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PYTHONPATH: /workspace/backend
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LS_OPENAPI_APP_KEY: ${LS_OPENAPI_APP_KEY}
      LS_OPENAPI_APP_SECRET: ${LS_OPENAPI_APP_SECRET}
      LS_OPENAPI_USER_ID: ${LS_OPENAPI_USER_ID}
    expose:
      - "8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run python -m bot.main
    environment:
      PYTHONPATH: /workspace/backend
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LS_OPENAPI_APP_KEY: ${LS_OPENAPI_APP_KEY}
      LS_OPENAPI_APP_SECRET: ${LS_OPENAPI_APP_SECRET}
      LS_OPENAPI_USER_ID: ${LS_OPENAPI_USER_ID}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_GROUP_ID: ${TELEGRAM_CHAT_GROUP_ID}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
    depends_on:
      - postgres
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run python -m monitor.main
    environment:
      PYTHONPATH: /workspace/backend
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LS_OPENAPI_APP_KEY: ${LS_OPENAPI_APP_KEY}
      LS_OPENAPI_APP_SECRET: ${LS_OPENAPI_APP_SECRET}
      LS_OPENAPI_USER_ID: ${LS_OPENAPI_USER_ID}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_GROUP_ID: ${TELEGRAM_CHAT_GROUP_ID}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
