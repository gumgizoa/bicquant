[project]
name = "lsapi"
version = "0.2.0"
requires-python = ">=3.12"
description = "LS Securities OpenAPI Python client (sync engine + async facade)"
dependencies = [
    "requests>=2.31",
    "websocket-client>=1.7",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
