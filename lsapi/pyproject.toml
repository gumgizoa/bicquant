[project]
name = "lsapi"
version = "0.1.0"
requires-python = ">=3.12"
description = "LS Securities OpenAPI Python client"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "websockets>=12",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
