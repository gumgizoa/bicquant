[project]
name = "dartapi"
version = "0.1.0"
requires-python = ">=3.12"
description = "DART OpenAPI Python client"
dependencies = [
    "httpx",
    "pandas",
    "lxml",
    "curl_cffi",
    "beautifulsoup4",
    "markdownify",
    "python-dotenv",
    "mcp",
]

[project.scripts]
dartapi-mcp = "dartapi.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
