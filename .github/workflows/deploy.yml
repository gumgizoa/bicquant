name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app
            git pull origin main
            # Explicitly specify docker-compose.yml to prevent docker-compose.override.yml
            # from being auto-merged. The override exposes postgres port 5432 to the host,
            # which must never happen in production.
            docker compose -f docker-compose.yml up -d --build
