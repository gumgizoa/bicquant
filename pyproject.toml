[tool.uv.workspace]
members = ["backend", "lsapi", "dartapi", "kofiaapi"]

[tool.ruff]
target-version = "py312"
line-length = 150
exclude = ["archive/", "parallels/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"dartapi/src/dartapi/dart_*.py" = ["E501"]
"lsapi/src/lsapi/generated/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "lsapi/tests", "backend/tests", "dartapi/tests", "kofiaapi/tests"]
pythonpath = ["backend", "lsapi/src", "dartapi/src", "kofiaapi/src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --import-mode=importlib"
markers = [
    "asyncio: marks tests as async (using pytest-asyncio)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
